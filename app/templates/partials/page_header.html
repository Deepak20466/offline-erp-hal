{% macro render_page_header(title, subtitle=None, icon=None) %}
<div class="page-header no-print">
  <div class="page-header-text">
    <h1 class="page-title">{% if icon %}<i class="bi {{ icon }}"></i>{% endif %}{{ title }}</h1>
    {% if subtitle %}<p class="page-subtitle">{{ subtitle }}</p>{% endif %}
  </div>
  {% if caller is defined %}
  <div class="page-header-actions">{{ caller() }}</div>
  {% endif %}
</div>
{% endmacro %}
