{% extends "base.html" %}
{% block title %}Login — Offline ERP HAL{% endblock %}
{% block content %}
<div class="login-page">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <img src="/static/images/hal-logo.jpeg" alt="HAL logo" class="login-logo">
      <h4 class="text-center text-hal-blue fw-bold mb-1">Offline ERP HAL</h4>
      <p class="text-center text-muted mb-4">Contract &amp; Invoice Management</p>

      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" novalidate autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="email" class="form-label">Email <span class="required-marker">*</span></label>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="off">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password <span class="required-marker">*</span></label>
          <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password">
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me" value="true">
          <label class="form-check-label" for="remember_me">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
      </form>
      <div class="text-center mt-3">
        <a href="/forgot-password" class="small text-decoration-none">Forgot password?</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
