{% extends "base.html" %}
{% block title %}Reset Password — Offline ERP HAL{% endblock %}
{% block content %}
<div class="login-page">
  <div class="card login-card" style="max-width: 460px;">
    <div class="card-body p-4 p-md-5">
      <img src="/static/images/hal-logo.jpeg" alt="HAL logo" class="login-logo" style="width:120px;height:auto;">
      <h5 class="text-center text-hal-blue fw-bold mb-3">Verify &amp; Reset Password</h5>

      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}

      <form method="post" action="/forgot-password/reset">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="email" value="{{ email }}">

        <div class="mb-3">
          <label class="form-label">Security Question</label>
          <p class="form-control-plaintext bg-light rounded px-2 py-1">{{ security_question }}</p>
        </div>
        <div class="mb-3">
          <label for="security_answer" class="form-label">Answer</label>
          <input type="text" class="form-control" id="security_answer" name="security_answer">
        </div>
        <div class="text-center text-muted small mb-3">— OR —</div>
        <div class="mb-3">
          <label for="admin_pin" class="form-label">Admin PIN</label>
          <input type="password" class="form-control" id="admin_pin" name="admin_pin">
        </div>
        <hr>
        <div class="mb-3">
          <label for="new_password" class="form-label">New Password <span class="required-marker">*</span></label>
          <input type="password" class="form-control" id="new_password" name="new_password" minlength="8" required>
          <div class="form-text">At least 8 characters, with a mix of letters and digits.</div>
        </div>
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirm Password <span class="required-marker">*</span></label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Reset Password</button>
      </form>
      <div class="text-center mt-3">
        <a href="/login" class="small text-decoration-none">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
