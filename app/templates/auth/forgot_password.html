{% extends "base.html" %}
{% block title %}Forgot Password — Offline ERP HAL{% endblock %}
{% block content %}
<div class="login-page">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <img src="/static/images/hal-logo.jpeg" alt="HAL logo" class="login-logo" style="width:120px;height:auto;">
      <h5 class="text-center text-hal-blue fw-bold mb-3">Forgot Password</h5>

      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}

      <form method="post" action="/forgot-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="email" class="form-label">Registered Email <span class="required-marker">*</span></label>
          <input type="email" class="form-control" id="email" name="email" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">Continue</button>
      </form>
      <div class="text-center mt-3">
        <a href="/login" class="small text-decoration-none">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
